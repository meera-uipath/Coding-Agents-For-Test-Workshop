site_name: Coding Agents for Test - Hands-On Workshop Guide
site_description: UiPath Test Cloud & Coding Agents for Test - Instructor-Led Workshop
docs_dir: docs
theme:
  name: material
  logo: assets/images/partner-success-logo-header.png
  palette:
    - scheme: light
      primary: blue
      accent: blue
    - scheme: dark
      primary: blue
      accent: blue

  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - toc.integrate
    - content.code.copy
    - content.tabs.link

extra:
  generator: false

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/mermaid.min.js
  - assets/js/mermaid-init.js
  - assets/js/sidebar-toggle.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Prerequisites:
    - Overview: module-0-prerequisites/index.md
    - Installation Guide: module-0-prerequisites/01-installation-guide.md
  - Introduction:
    - Test Cloud & Test Manager: module-1-introduction/index.md
  - Hands-On Workshop:
    - Overview: module-2-hands-on-workshop/index.md
    - Import the Test Manager Project: module-2-hands-on-workshop/01-import-tm-project.md
    - Evaluate Requirements: module-2-hands-on-workshop/02-evaluate-requirements.md
    - Generate Test Cases: module-2-hands-on-workshop/03-generate-test-cases.md
    - Connect Studio to Test Manager: module-2-hands-on-workshop/04-connect-studio-to-tm.md
    - Automate Test Cases: module-2-hands-on-workshop/05-automate-test-cases.md
    - Generate Test Data: module-2-hands-on-workshop/06-generate-test-data.md
    - Publish Test Cases: module-2-hands-on-workshop/07-publish-test-cases.md
    - Configure the Test Manager Folder: module-2-hands-on-workshop/08-configure-tm-folder.md
    - Create a Test Set: module-2-hands-on-workshop/09-create-test-set.md
    - Run and Report with a Coding Agent: module-2-hands-on-workshop/10-run-and-report.md
    - You Did It!: module-2-hands-on-workshop/you-did-it.md
  - Troubleshooting & Next Steps:
    - Overview: module-3-troubleshooting-and-next-steps/index.md
    - More Agent Prompts: module-3-troubleshooting-and-next-steps/01-more-agent-prompts.md
    - Troubleshooting: module-3-troubleshooting-and-next-steps/02-troubleshooting.md
